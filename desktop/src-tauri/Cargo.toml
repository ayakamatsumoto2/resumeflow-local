[package]
name = "sunmao-resume"
version = "0.1.0"
description = "榫卯简历 · ResumeFLOW 本地版（AGPL-3.0-or-later）"
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "sunmao_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
